[project]
name = "wude-mart-backend"
version = "0.2.0"
description = "Wude Mart FastAPI Backend on Cloudflare Python Workers"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi",
    "pydantic",
    "python-multipart"
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk"
]
